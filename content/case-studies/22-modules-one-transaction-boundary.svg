<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 46 666 312" fill="none" stroke="currentColor" aria-hidden="true">
  <!--
    Slot 3's checkable artifact: twenty-two modules and where the transaction
    boundary is drawn (#6, #17).

    The rules this file is authored under are in the README beside it. What is
    written here is only what is true of THIS drawing.

    SECTION MAPPING. `data-sections` holds heading slugs, so #26 can derive the
    key from the h2 itself and needs no lookup table:

      the-problem   the field of twenty-two, and the four one write crosses
      the-decision  the four, the write, and the boundary drawn around them
      the-cost      the boundary on its own, which is the thing no signature
                    shows

    WHY THE COUNT IS DRAWN AND NOT WRITTEN. The heading says twenty-two, and a
    number in a heading is a claim. Eighteen blank squares beside four named
    ones is the same fact as a sentence, and the reader can count it.

    NOTHING IS DASHED. Slot 1 and slot 2 draw a broken state with a dashed
    stroke. There is no broken state here: every module in this drawing works,
    and the argument is about where a boundary goes. Dashing the boundary to
    make it look like the others would say it was broken, which it is not.
    There is no hue in this file either way.

    GEOMETRY. A six-column grid: squares 88 x 44 at a pitch of 108 and 64, so
    every gap is 20. Columns at x = 40 / 148 / 256 / 364 / 472 / 580, rows at
    y = 60 / 124 / 188, and then the fourth row at y = 264 rather than 252 —
    the extra 12 is what keeps the boundary's top edge off the row above it.

    Row four holds four squares, not six, which is what leaves the right of it
    clear for the write to arrive along.

    The boundary is inset 14 from the four it encloses, and its label sits
    under it rather than on it: above it is the third row, and the only other
    free side is the one the write comes in on.

    The viewBox is fitted to the ink. The drawing runs x 26..668 and
    y 60..344.

    TYPE SIZE. 13 in the modules and 12.5 on the labels. The figure caps at
    40rem, so a user unit is 0.961 of a CSS pixel at the widest the column
    goes: 12.5 renders at 12px, well over the 11px `--text-label` floor in
    globals.css. The modules are 88 wide, and "invoicing" at 13 is the longest
    label in one: the type is JetBrains Mono, so a glyph is 0.6 of the font
    size and nine of them come to 70.2, which leaves 8.9 each side.
  -->

  <!-- The eighteen this write never touches. Unlabelled: naming them would
       spend the reader's attention on the part of the count that is only a
       count. -->
  <g id="modules-untouched" data-part data-sections="the-problem">
    <rect x="40" y="60" width="88" height="44" stroke-width="1" />
    <rect x="148" y="60" width="88" height="44" stroke-width="1" />
    <rect x="256" y="60" width="88" height="44" stroke-width="1" />
    <rect x="364" y="60" width="88" height="44" stroke-width="1" />
    <rect x="472" y="60" width="88" height="44" stroke-width="1" />
    <rect x="580" y="60" width="88" height="44" stroke-width="1" />
    <rect x="40" y="124" width="88" height="44" stroke-width="1" />
    <rect x="148" y="124" width="88" height="44" stroke-width="1" />
    <rect x="256" y="124" width="88" height="44" stroke-width="1" />
    <rect x="364" y="124" width="88" height="44" stroke-width="1" />
    <rect x="472" y="124" width="88" height="44" stroke-width="1" />
    <rect x="580" y="124" width="88" height="44" stroke-width="1" />
    <rect x="40" y="188" width="88" height="44" stroke-width="1" />
    <rect x="148" y="188" width="88" height="44" stroke-width="1" />
    <rect x="256" y="188" width="88" height="44" stroke-width="1" />
    <rect x="364" y="188" width="88" height="44" stroke-width="1" />
    <rect x="472" y="188" width="88" height="44" stroke-width="1" />
    <rect x="580" y="188" width="88" height="44" stroke-width="1" />
  </g>

  <!-- The four one booking writes to, in the order it writes them. -->
  <g id="mod-job-card" data-part data-sections="the-problem the-decision">
    <rect x="40" y="264" width="88" height="44" stroke-width="1.5" />
    <text x="84" y="291" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">job card</text>
  </g>
  <g id="mod-parts" data-part data-sections="the-problem the-decision">
    <rect x="148" y="264" width="88" height="44" stroke-width="1.5" />
    <text x="192" y="291" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">parts</text>
  </g>
  <g id="mod-invoicing" data-part data-sections="the-problem the-decision">
    <rect x="256" y="264" width="88" height="44" stroke-width="1.5" />
    <text x="300" y="291" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">invoicing</text>
  </g>
  <g id="mod-audit" data-part data-sections="the-problem the-decision">
    <rect x="364" y="264" width="88" height="44" stroke-width="1.5" />
    <text x="408" y="291" text-anchor="middle" font-size="13" fill="currentColor" stroke="none">audit</text>
  </g>

  <!-- The write arrives from the entry point and stops at the boundary, which
       is the whole point: it is the request that opens the transaction, and
       nothing inside is handed one. The head is drawn inline in the same group
       so it dims with its edge.

       The tail runs out to x=668, which is the right edge of the grid and of
       the ink. It is the one line here that leaves no box, so it has to leave
       the frame instead: ending it short, under the last module of the third
       row, draws an arrow that looks like it comes OUT of that module — which
       is the opposite of what this says, and worse under tracking, where that
       module is dimmed and this line is not. -->
  <g id="edge-write" data-part data-sections="the-problem the-decision">
    <path d="M668,286 L474,286" stroke-width="1" />
    <path d="M481,282 L474,286 L481,290" stroke-width="1.2" />
    <text x="571" y="276" text-anchor="middle" font-size="12.5" opacity="0.72" fill="currentColor" stroke="none">one write</text>
  </g>

  <!-- One boundary, around four modules rather than through twenty-two sets of
       call signatures. -->
  <g id="boundary" data-part data-sections="the-decision the-cost">
    <rect x="26" y="250" width="440" height="72" stroke-width="1.5" />
    <text x="246" y="340" text-anchor="middle" font-size="12.5" opacity="0.72" fill="currentColor" stroke="none">one transaction</text>
  </g>
</svg>
