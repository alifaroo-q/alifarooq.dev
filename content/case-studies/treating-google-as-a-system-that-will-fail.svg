<svg xmlns="http://www.w3.org/2000/svg" viewBox="28 -6 686 276" fill="none" stroke="currentColor" aria-hidden="true">
  <!--
    Slot 1's checkable artifact: the Gmail connection state machine (#6, #17).

    The rules this file is authored under are in the README beside it. What is
    written here is only what is true of THIS drawing.

    SECTION MAPPING. `data-sections` holds heading slugs, so #26 can derive the
    key from the h2 itself and needs no lookup table:

      the-problem   the two ways it breaks, and the one state it breaks into
      the-decision  the machine that catches them, and the dead state it names
      the-cost      the one edge that needs a person, and the state it leaves

    A part can belong to more than one section. `state-disconnected` is in all
    three: it is where both failures land, it is the state the decision names,
    and it is the state only a person can leave.

    THERE IS ONE DEAD STATE, NOT TWO. The row stores `gmail_connected` plus a
    `disconnect_reason` of `manual_disconnect` or `invalid_grant`, and a check
    constraint holds the two together. `invalid` is a reason, so it is a label
    on an edge here, never a box.

    GEOMETRY. Three columns at x = 40 / 296 / 552, boxes 150 x 46, so every
    horizontal gap is 106. That number is set by the labels, not by taste: the
    boxes were 168 wide at first, which left gaps of 88, and measured in the
    browser the three labels sitting in those gaps cleared the box beside them
    by 9.1px, 4.2px and 1.7px. Under 2px reads as a collision.

    Every edge leaves its box flush and stops 8 short of the next one, in both
    directions — the arrowhead tip is the end of the path.

    The viewBox is fitted to the ink rather than set to a round number. The
    drawing runs x 40..702 and y 8..256; a round box left 44 units of dead
    space below the graph and 9 above it, and the figure column paid for both.
    Dropping the second dead state took the right edge from 736 to 702, so the
    box came in with it.

    TYPE SIZE. 14 in the boxes and 12.5 on the edges, not the 13/10.5 this
    started at. The drawing is scaled to the figure, and the figure caps at
    40rem, so a user unit is 0.894 of a CSS pixel at the widest the column
    ever goes. `--text-label` in globals.css is a floor at 11px with nothing
    below it, and measured there: 10.5 rendered at 9.4px and 12 at 10.7px,
    both under it. 12.5 renders at 11.2px and clears it.
  -->

  <!-- The states. Solid is a state where mail moves; dashed is a state where
       it has stopped. Dashed rather than red: there is no hue in this file. -->
  <g id="state-connected" data-part data-sections="the-decision">
    <rect x="40" y="60" width="150" height="46" stroke-width="1.5" />
    <text x="115" y="88" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">connected</text>
  </g>
  <g id="state-watch-expiring" data-part data-sections="the-decision">
    <rect x="296" y="60" width="150" height="46" stroke-width="1.5" />
    <text x="371" y="88" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">watch expiring</text>
  </g>
  <g id="state-renewing" data-part data-sections="the-decision">
    <rect x="552" y="60" width="150" height="46" stroke-width="1.5" />
    <text x="627" y="88" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">renewing</text>
  </g>
  <g id="state-disconnected" data-part data-sections="the-problem the-decision the-cost">
    <rect x="296" y="210" width="150" height="46" stroke-width="1" stroke-dasharray="3 3" />
    <text x="371" y="238" text-anchor="middle" font-size="14" fill="currentColor" stroke="none">disconnected</text>
  </g>

  <!-- The happy path, left to right, and the loop back over the top. -->
  <g id="edge-ttl-threshold" data-part data-sections="the-decision">
    <path d="M190,83 L288,83" stroke-width="1" />
    <path d="M281,79 L288,83 L281,87" stroke-width="1.2" />
    <text x="243" y="73" text-anchor="middle" font-size="12.5" opacity="0.72" fill="currentColor" stroke="none">ttl &lt; 24h</text>
  </g>
  <g id="edge-renewal-job" data-part data-sections="the-decision">
    <path d="M446,83 L544,83" stroke-width="1" />
    <path d="M537,79 L544,83 L537,87" stroke-width="1.2" />
    <text x="499" y="73" text-anchor="middle" font-size="12.5" opacity="0.72" fill="currentColor" stroke="none">renewal job</text>
  </g>
  <g id="edge-renewed" data-part data-sections="the-decision">
    <path d="M627,60 L627,28 L115,28 L115,52" stroke-width="1" />
    <path d="M111,45 L115,52 L119,45" stroke-width="1.2" />
    <text x="371" y="19" text-anchor="middle" font-size="12.5" opacity="0.72" fill="currentColor" stroke="none">renewed</text>
  </g>

  <!-- The two ways it breaks. Both land in the one dashed state, and both
       carry the same reason — what differs is which job finds it. The two
       runs along y=180 are 163..340 and 402..627, so they share the line
       without touching, and neither crosses the re-consent return below. -->
  <g id="edge-webhook-invalid-grant" data-part data-sections="the-problem">
    <path d="M163,106 L163,180 L340,180 L340,202" stroke-width="1" />
    <path d="M336,195 L340,202 L344,195" stroke-width="1.2" />
    <text x="252" y="171" text-anchor="middle" font-size="12.5" opacity="0.72" fill="currentColor" stroke="none">webhook: invalid_grant</text>
  </g>
  <g id="edge-renewal-invalid-grant" data-part data-sections="the-problem">
    <path d="M627,106 L627,180 L402,180 L402,202" stroke-width="1" />
    <path d="M398,195 L402,202 L406,195" stroke-width="1.2" />
    <text x="514" y="171" text-anchor="middle" font-size="12.5" opacity="0.72" fill="currentColor" stroke="none">renewal: invalid_grant</text>
  </g>

  <!-- The return belongs to the cost. It is routed out at x=70 so it passes
       left of the webhook drop at x=163 — no edge in this graph crosses
       another. -->
  <g id="edge-re-consent" data-part data-sections="the-cost">
    <path d="M296,233 L70,233 L70,114" stroke-width="1" />
    <path d="M66,121 L70,114 L74,121" stroke-width="1.2" />
    <text x="183" y="251" text-anchor="middle" font-size="12.5" opacity="0.72" fill="currentColor" stroke="none">re-consent</text>
  </g>
</svg>
