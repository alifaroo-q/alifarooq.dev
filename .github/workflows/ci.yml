name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lint and typecheck only. Why this job does not build, and what would change
# that, is in docs/deploy.md.
jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck
